# nura-server-shell — настройки (/etc/nura-server-shell.conf)
# Блокировка экрана паролем пользователя: 1 — включена, 0 — выключена.
# Экран блокируется при запуске, при каждом гашении экрана и коротким нажатием питания.
LOCK=1
# Чей пароль спрашивать. Пусто — основной пользователь (первый с UID 10000..59999).
LOCK_USER=
